<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doReview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .dashboard {
            display: flex;
        }
        .sidebar {
            width: 250px;
            background-color: #333;
            color: #fff;
            height: 100vh;
            padding: 20px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin: 20px 0;
        }
        .sidebar ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
        }
        .content {
            flex: 1;
            padding: 20px;
        }
        .content h1 {
            margin-bottom: 20px;
        }
        .content section {
            margin-bottom: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .btn {
            padding: 5px 10px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #555;
        }
        form label {
            display: block;
            margin-top: 10px;
        }
        form input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="content">
            <h1>User Dashboard</h1>

            <!-- View orders -->
            <section id = "User-view-orders">
                <h2>Your orders</h2>

            </section>


            <!-- View reviews -->
            <section id="comments">
                <h2>Answer comments</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Purchased Clothing Item</th>
                            <th>Latest Comment from Admin</th>
                            <th>Write Response</th>
                            <th>Click Button to Send Response</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if reviews %}
                            {% for review in reviews %}
                                <!-- Display only customer reviews (no parent_review_id) -->
                                {% if not review.parent_review_id %}
                                    <tr data-review-id="{{ review.review_id }}">
                                        <!-- Clothing Item ID -->
                                        <td><input type="text" value="{{ review.review_asset_id }}" readonly></td>
                                        <!-- Admin Comment -->
                                        <td><input type="text" value="{{ review.review_asset_comments }}" readonly></td>
                                        <!-- Customer Response Input -->
                                        <td><input type="text" id="response-{{ review.review_id }}" placeholder="Write your response here"></td>
                                        <!-- Send Response Button -->
                                        <td><button onclick="saveResponse('{{ review.review_id }}')">Respond</button></td>
                                    </tr>
                                {% endif %}
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td colspan="5">No reviews found.</td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </section>



                <div onclick="logout()">
                    <button class="btn btn-warning" style="background-color: #f7d9e2;">Logout</button>
                </div>


        </div>
    </div>

</body>
</html>
