<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/index.css">
 
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Clothing Store</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        sessionStorage.clear();
        $(function () {
            $('[data-toggle="popover"]').popover()
           
        })
        function openNav() {
        document.getElementById("mySidenav").style.width = "250px";
        }

        function closeNav() {
        document.getElementById("mySidenav").style.width = "0";
        }

        function sendLoginPage() {
               fetch('/login')
               .then(response => response.text())
               .then(data => {
                console.log(data);
                   document.getElementById('content-page').innerHTML = data;
               });
        }

        function sendRegistrationPage() {
               fetch('/registration')
               .then(response => response.text())
               .then(data => {
                console.log(data);
                   document.getElementById('content-page').innerHTML = data;
               });
        }

        function addToCart(button) {
            // Get parent product div
            let product = button.parentElement.parentElement;
            console.log(product);
            // Extract product details
            let productData = {
                id: product.getAttribute("data-id"),
                name: product.getAttribute("data-name"),
                price: product.getAttribute("data-price")
            };

            // Send product data to Python backend
            fetch('/add_to_cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            })
            .then(response => response.json())
            .then(data => alert(data.message)) // Show success message
            .catch(error => console.error("Error:", error));
        }

        function logout() {
            fetch('/logout')
            .then(response => response.text())
            .then(data => {
                console.log(data);
                document.getElementById('login-button').innerHTML = 
                '<div onclick=sendLoginPage(); class="btn btn-light">'                            
                +'<i class="bi bi-person-circle"></i> Login'
                +'</div>';
                //document.getElementById('content-page').innerHTML = data;
            });
        }
        

    </script>
</head>
<body>
    
    <div class="full-page">

        <div class="top-bar">
            <div class = "top-bar-left">
                <div onclick="buttonClick('hamburgermenu')"><i class="bi bi-list"></i> Menu </div>
                <div> <a href="/"><img src="/static/images/logo.png" alt="Logo" style="height: 35px;"></a></div>
            </div>
            <!-- Integrated Search Bar -->
            
            <div class = "top-bar-middle">
                <div class="search-container position-relative">
                    <form class="d-flex align-items-center">
                        <input class="form-control search-input ps-5" type="search"
                                placeholder="Search anything..." aria-label="Search" style="padding-top: 0;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="search-icon feather feather-search" type = "submit" style=" margin-left: 80%;">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        
                    </form>
                </div>
            </div>
            
            <div class = "top-bar-right" >
                <!-- Login Button -->
              <div id="login-button">
                    {% if session['username'] is defined %}
                        <div onclick="logout()" class="btn btn-light">
                            <i class="bi bi-person-circle"></i> {{ session['username'] }}
                            <div><button class="btn btn-warning">Logout</button></div>
                            
                        </div>
                    {% else %}
                        <div onclick=sendLoginPage(); class="btn btn-light">
                            <i class="bi bi-person-circle"></i> Login
                        </div>
                    {% endif %}
                </div>
                <!-- shoppingcart Button -->
                <div onclick="openNav()" class="btn btn-light">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="pink" class="bi bi-bag-heart-fill" viewBox="0 0 16 16">
                        <path d="M11.5 4v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m0 6.993c1.664-1.711 5.825 1.283 0 5.132-5.825-3.85-1.664-6.843 0-5.132"/>
                    </svg>
                </div>
            </div>
        </div>

        <div id="mySidenav" class="sidenav">
            <div class="sidenav-content">
                <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Clients</a>
                <a href="#">Contact</a>
                <a href ="/shoppingcart"> <button class="btn btn-light" style="position:absolute; bottom:10px; left:15%; background-color: #f7d9e2;"> Continue to checkout </button> </a>
            </div>
        </div>

            
           

        <div id="content-page" class="content-page" >
            
            <div id = "product-gallery">
                {% for asset in assets %}
                    <div class = "product-card" data-id="1" data-name="Dress" data-price="1200">
                        
                        <div class = "product-image">
                            <img src="/static/images/{{ asset[5] }}">
                            
                                <button class="cart-button" data-container="body" data-toggle="popover" data-placement="bottom" data-content="Login to add item to cart"  >
                                    
                                    <div onclick="addToCart(this)" style="pointer-events: none; padding:0;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="pink" class="bi bi-bag-heart-fill" viewBox="0 0 16 16" >
                                        <path d="M11.5 4v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m0 6.993c1.664-1.711 5.825 1.283 0 5.132-5.825-3.85-1.664-6.843 0-5.132"/>
                                    </svg>
                                </div>
                                </button>
                            
                            
                        </div>
                        <div class = "product-info">
                            <h4>{{ asset[2] }}</h4>
                            <p>{{ asset[3] }} kr</p>

                        </div>
                    </div>
                {% endfor %}
            </div>
            
        </div>

        
        <div class="footer">
           
        </div>      
    </div>
</body>
</html>
